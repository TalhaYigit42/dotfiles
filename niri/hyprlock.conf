# Lock screen v2: minimal, big clean clock, wallpaper stays visible
general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 6, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
    animation = inputFieldColors, 1, 3, ease
}

background {
    monitor =
    path = $HOME/Pictures/Wallpapers/lock.jpg
    blur_passes = 0
    brightness = 0.95
    contrast = 1.05
    vibrancy = 0.1
    noise = 0.01
}

# big clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.95)
    font_size = 150
    font_family = CaskaydiaCove Nerd Font Bold
    position = 150, 150
    halign = left
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(210, 190, 255, 0.95)
    font_size = 20
    font_family = CaskaydiaCove Nerd Font
    position = 156, 40
    halign = left
    valign = center
}

# thin accent line
shape {
    monitor =
    size = 60, 3
    color = rgba(167, 123, 255, 1.0)
    rounding = 2
    position = 156, -5
    halign = left
    valign = center
}

# password field
input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.28)
    inner_color = rgba(0, 0, 0, 0.35)
    font_color = rgba(255, 255, 255, 1.0)
    check_color = rgba(143, 224, 122, 0.9)
    fail_color = rgba(224, 96, 122, 0.9)
    capslock_color = rgba(214, 179, 106, 0.9)
    fade_on_empty = false
    rounding = 25
    font_family = CaskaydiaCove Nerd Font
    placeholder_text = <span foreground="##d8c8ff"><i>enter password</i></span>
    fail_text = <i>$FAIL</i>
    hide_input = false
    position = 156, -80
    halign = left
    valign = center
}

# now playing (only while Spotify plays)
label {
    monitor =
    text = cmd[update:2000] $HOME/.config/niri/scripts/nowplaying.sh
    color = rgba(255, 255, 255, 0.8)
    font_size = 14
    font_family = CaskaydiaCove Nerd Font
    position = 156, 70
    halign = left
    valign = bottom
}

# quote
label {
    monitor =
    text = cmd[update:60000] $HOME/.config/niri/scripts/quote.sh
    color = rgba(255, 255, 255, 0.45)
    font_size = 13
    font_family = CaskaydiaCove Nerd Font
    position = 156, 38
    halign = left
    valign = bottom
}

# battery
label {
    monitor =
    text = cmd[update:30000] echo "$(cat /sys/class/power_supply/BAT0/capacity)%"
    color = rgba(255, 255, 255, 0.55)
    font_size = 13
    font_family = CaskaydiaCove Nerd Font
    position = -28, 28
    halign = right
    valign = bottom
}
