daemonize
show-failed-attempts
fade-in=0.25
font=CaskaydiaCove Nerd Font
font-size=28

# blurred wallpaper + vignette
effect-blur=12x5
effect-vignette=0.4:0.6

# big clock + date
clock
timestr=%H:%M:%S
datestr=%A, %d %B

# ring
indicator
indicator-radius=120
indicator-thickness=10
indicator-caps-lock
line-uses-ring
inside-color=0e0c16d9
inside-clear-color=0e0c16d9
inside-ver-color=0e0c16d9
inside-wrong-color=0e0c16d9
ring-color=a77bff
ring-clear-color=7d7a96
ring-ver-color=8fe07a
ring-wrong-color=e0607a
key-hl-color=8fe07a
bs-hl-color=e0607a
caps-lock-key-hl-color=fab387
caps-lock-bs-hl-color=f38ba8
separator-color=00000000
line-color=00000000
text-color=d9d4ee
text-clear-color=7d7a96
text-ver-color=8fe07a
text-wrong-color=e0607a
text-caps-lock-color=fab387
