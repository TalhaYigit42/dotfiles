name: lint

on: [push, pull_request]

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (errors only)
        run: find . -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 shellcheck -S error
      - name: Python syntax
        run: python3 -m py_compile $(git ls-files '*.py')
