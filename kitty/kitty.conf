
# Minimal Tab bar styling 
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# remap to open new kitty tab in the same directory (default is home dir)
# map ctrl+shift+t            new_tab_with_cwd

# Uncomment the following 4 lines to minimize kitty latency (higher energy usage)
# input_delay 0
# repaint_delay 2
# sync_to_monitor no
# wayland_enable_ime no

# --- See-through terminal (niri has no blur, so keep it fairly opaque) ---
background_opacity          0.82
dynamic_background_opacity  yes
# ctrl+shift+a then m/l = more/less opacity, 1 = reset
map ctrl+shift+a>m          set_background_opacity +0.05
map ctrl+shift+a>l          set_background_opacity -0.05
map ctrl+shift+a>1          set_background_opacity 1
map ctrl+shift+a>d          set_background_opacity default

# --- Nicer look ---
window_padding_width        18
cursor_trail                3
cursor_shape                beam
cursor_blink_interval       0
confirm_os_window_close     0

